name: Android CI

on:
  push:
    branches: [ main, beta, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite3 for unit tests
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build Debug & Verify Release Build
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/ || true
          ls -lh artifacts/

      - name: Upload CI APKs
        uses: actions/upload-artifact@v4
        with:
          name: playswitch-ci-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
