name: Release & Beta Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0-beta.2 or 1.0.0)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version & Channel
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.version_name }}"
            RAW_VER="${RAW_VER#v}"
            CHANNEL="${{ inputs.channel }}"
            if [ "$CHANNEL" = "beta" ] && [[ "$RAW_VER" != *-* ]]; then
              RAW_VER="${RAW_VER}-beta.1"
            fi
          else
            RAW_VER="${GITHUB_REF_NAME#v}"
          fi

          # Monotonic SemVer versionCode: X*100000 + Y*1000 + Z*100 + channelOffset
          CORE="${RAW_VER%%-*}"
          IFS='.' read -r MAJ MIN PAT <<< "$CORE"
          MAJ=${MAJ:-1}; MIN=${MIN:-0}; PAT=${PAT:-0}

          OFFSET=99
          PRERELEASE="false"
          if [[ "$RAW_VER" == *-* ]]; then
            PRE="${RAW_VER#*-}"
            NUM=$(echo "$PRE" | grep -oE '[0-9]+$' || echo "1")
            if [[ "$PRE" == alpha* ]]; then
              OFFSET=$((NUM))
              PRERELEASE="true"
            elif [[ "$PRE" == beta* ]]; then
              OFFSET=$((20 + NUM))
            elif [[ "$PRE" == rc* ]]; then
              OFFSET=$((60 + NUM))
              PRERELEASE="true"
            else
              OFFSET=10
              PRERELEASE="true"
            fi
          fi
          VER_CODE=$((MAJ * 100000 + MIN * 1000 + PAT * 100 + OFFSET))
          CHANNEL_UPPER="STABLE"
          if [[ "$RAW_VER" == *-alpha* ]]; then
            CHANNEL_UPPER="ALPHA"
          elif [[ "$RAW_VER" == *-beta* ]]; then
            CHANNEL_UPPER="BETA"
          elif [[ "$RAW_VER" == *-rc* ]]; then
            CHANNEL_UPPER="RC"
          fi

          echo "version_name=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "build_channel=$CHANNEL_UPPER" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing!" >&2
            exit 1
          fi
          KS_PATH="$RUNNER_TEMP/release-keystore.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KS_PATH"
          echo "path=$KS_PATH" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests & Lint Vital
        run: |
          ./gradlew testDebugUnitTest lintVitalRelease --no-daemon \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}" \
            -PbuildChannel="${{ steps.meta.outputs.build_channel }}"

      - name: Build Signed Release & Debug APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}" \
            -PbuildChannel="${{ steps.meta.outputs.build_channel }}"

      - name: Verify APK Signature & Collect Assets
        run: |
          mkdir -p dist
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Signed release APK missing!" >&2
            exit 1
          fi
          VER="${{ steps.meta.outputs.version_name }}"
          cp "$RELEASE_APK" "dist/PlaySwitch-v${VER}.apk"
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "dist/PlaySwitch-v${VER}-debug.apk"
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n1)
          "$APKSIGNER" verify -v "dist/PlaySwitch-v${VER}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Generate Release Notes
        shell: bash
        run: |
          VER="${{ steps.meta.outputs.version_name }}"
          IS_PRE="${{ steps.meta.outputs.prerelease }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^v${VER}\$" | head -n1 || true)

          {
            if [ -z "$PREV_TAG" ]; then
              echo "## First Public Beta — Play Switch v${VER}"
              echo ""
              echo "> **Beta Notice:** This is the first public beta release of Play Switch. Automatic backups are saved before any change, and you can also export a ZIP backup before testing."
            elif [[ "$VER" == *-* ]]; then
              echo "## Play Switch v${VER} (Beta)"
              echo ""
              echo "> **Beta Notice:** Pre-release testing build. Updates cleanly over earlier Beta or Stable releases using the same release signature."
            else
              echo "## Play Switch v${VER} (Stable)"
            fi
            echo ""
            echo "### What's Inside"
            echo "- Switch your phone's primary Google account without removing your other accounts *(requires a restart)*."
            echo "- Change which Google account an app uses in Google Play (**Purchases**, **Updates**, or **Both**) right away without restarting."
            echo "- Clear stuck per-app Google sign-in links."
            echo "- Automatic backups (with ZIP export/import) and safety checks before editing system or Play Store files."
            echo ""
            echo "### Which File to Download"
            echo "- **\`PlaySwitch-v${VER}.apk\`** *(Recommended)* — Main app for daily use (\`com.playswitch.ziadzero\`)."
            echo "- **\`PlaySwitch-v${VER}-debug.apk\`** *(Optional Debug)* — Installs side-by-side (\`com.playswitch.ziadzero.debug\`) for testing or capturing logs without replacing your main app."
            echo "- **\`SHA256SUMS.txt\`** — Checksums to verify downloaded files."
            echo ""
            echo "### Requirements"
            echo "- Rooted Android **10+** via **Magisk**, **KernelSU**, or **APatch**"
            echo "- Google Play Store (\`com.android.vending\`)"
          } > dist/RELEASE_NOTES.md

      - name: Clean Up Keystore File
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Play Switch ${{ steps.meta.outputs.tag_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
